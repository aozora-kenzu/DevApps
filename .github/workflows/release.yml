name: Build and Release UniDevUI

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-windows:
    name: Build Windows (amd64)
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails CLI v2
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.1
          $goBin = Join-Path (go env GOPATH) "bin"
          Add-Content -Path $env:GITHUB_PATH -Value $goBin

      - name: Install frontend dependencies & build initial assets
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Generate Wails bindings
        run: wails generate module

      - name: Rebuild frontend assets after binding generation
        working-directory: frontend
        run: npm run build

      - name: Run unit tests
        run: go test -v -short -count=1 ./...

      - name: Build portable UniDevUI.exe
        run: wails build -clean

      - name: Package portable release zip
        run: |
          $stage = Join-Path $env:RUNNER_TEMP "release_stage"
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Copy-Item build/bin/UniDevUI.exe (Join-Path $stage "UniDevUI.exe")
          Copy-Item README.md (Join-Path $stage "README.md")
          Copy-Item README.id.md (Join-Path $stage "README.id.md")
          Copy-Item LICENSE (Join-Path $stage "LICENSE")
          Copy-Item LICENSE-ID.md (Join-Path $stage "LICENSE-ID.md")
          Compress-Archive -Path (Join-Path $stage "*") -DestinationPath UniDevUI-windows-amd64.zip -Force

      - name: Upload workflow build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: UniDevUI-windows-amd64
          path: |
            build/bin/UniDevUI.exe
            UniDevUI-windows-amd64.zip

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            build/bin/UniDevUI.exe
            UniDevUI-windows-amd64.zip
