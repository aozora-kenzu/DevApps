name: Build and Release DevApps

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-windows:
    name: Build Windows (amd64)
    runs-on: windows-latest
    shell: pwsh

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails CLI v2
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.1
          "$(go env GOPATH)\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install frontend dependencies & build assets
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Generate Wails bindings
        run: wails generate module

      - name: Run unit tests
        run: go test -v -short -count=1 ./...

      - name: Build portable DevApps.exe
        run: wails build -clean

      - name: Package portable release zip
        run: |
          New-Item -ItemType Directory -Path release_stage -Force | Out-Null
          Copy-Item build/bin/DevApps.exe release_stage/DevApps.exe
          Copy-Item README.md release_stage/README.md
          Copy-Item README.id.md release_stage/README.id.md
          Copy-Item LICENSE release_stage/LICENSE
          Copy-Item LICENSE-ID.md release_stage/LICENSE-ID.md
          Compress-Archive -Path release_stage/* -DestinationPath DevApps-windows-amd64.zip -Force

      - name: Upload workflow build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DevApps-windows-amd64
          path: |
            build/bin/DevApps.exe
            DevApps-windows-amd64.zip

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            build/bin/DevApps.exe
            DevApps-windows-amd64.zip
